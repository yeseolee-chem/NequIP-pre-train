# Halo8 NequIP 0.9.1 pre-training (PyTorch Lightning + DDP)
#
# Migration from 0.6.2 to 0.9.1 was driven by the DDP requirement —
# the older config schema doesn't exist; this is a full rewrite to
# Hydra/Lightning style. Architecture and data choices preserve the
# v5 spec intent (Batzner 2022 hyperparameters, EMA, ReduceLROnPlateau,
# 8-species type set, force + per-atom-energy loss).

# ===========
#     RUN
# ===========
run: [train]


# ===========================
#  Top-level interpolated vars
# ===========================
cutoff_radius: 5.0
num_layers: 4
l_max: 2
num_features: 64

# 8 species — H, C, N, O, F, S, Cl, Br — discovered in the extxyz scan.
model_type_names: [H, C, N, O, F, S, Cl, Br]
chemical_species: ${model_type_names}

# Metric used by ModelCheckpoint / EarlyStopping / LR scheduler.
monitored_metric: val0_epoch/weighted_sum


# ============
#     DATA
# ============
data:
  _target_: nequip.data.datamodule.ASEDataModule
  seed: 42

  # The extxyz files were produced by scripts/prepare_data.py using strict_v1
  # F0-passed reactions, with the 500-reaction ADF holdout removed and a
  # 300-frame linspace endpoint-preserving subsample per reaction.
  train_file_path:
    /gpfs/home1/yeseo1ee/projects/halo8-nequip-pretrain/output/halo8_nequip_v1/data/halo8_train.extxyz
  val_file_path:
    /gpfs/home1/yeseo1ee/projects/halo8-nequip-pretrain/output/halo8_nequip_v1/data/halo8_val.extxyz

  key_mapping:
    energy: total_energy
    forces: forces

  transforms:
    - _target_: nequip.data.transforms.ChemicalSpeciesToAtomTypeMapper
      chemical_symbols: ${chemical_species}
    - _target_: nequip.data.transforms.NeighborListTransform
      r_max: ${cutoff_radius}

  # Per-GPU batch sizes (Lightning will run independent dataloaders per rank).
  # Effective global batch_size = 32 * num_gpus. Empirical RTX 3090 sweet
  # spot from the 0.6.2 run (bs=32, num_workers=8 → 80%+ GPU util).
  train_dataloader:
    _target_: torch.utils.data.DataLoader
    batch_size: 32
    num_workers: 8
    shuffle: true
    persistent_workers: true
  val_dataloader:
    _target_: torch.utils.data.DataLoader
    batch_size: 64
    num_workers: ${data.train_dataloader.num_workers}
    persistent_workers: true
  test_dataloader: ${data.val_dataloader}

  stats_manager:
    _target_: nequip.data.CommonDataStatisticsManager
    dataloader_kwargs:
      batch_size: 64
    type_names: ${model_type_names}


# =============
#    TRAINER
# =============
trainer:
  _target_: lightning.Trainer
  accelerator: gpu
  devices: 4                  # 4× RTX 3090 single node
  # NequIP-provided DDP that does manual gradient all_reduce instead of
  # wrapping the model in torch.nn.parallel.DistributedDataParallel. The
  # default `strategy: ddp` has caused four silent NCCL allreduce hangs
  # at unpredictable epoch boundaries (649909, 650533, and twice in 650969).
  # NCCL timeouts (TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC=600 etc.) did NOT fire.
  # SimpleDDPStrategy is documented as the more robust path for this kind
  # of multi-rank training where the default wrapper has trouble.
  strategy:
    _target_: nequip.train.SimpleDDPStrategy
  precision: 32-true
  enable_checkpointing: true
  max_epochs: 200
  log_every_n_steps: 100
  num_sanity_val_steps: 0     # skip the (slow) pre-training sanity validation

  logger:
    _target_: lightning.pytorch.loggers.CSVLogger
    save_dir:
      /gpfs/home1/yeseo1ee/projects/halo8-nequip-pretrain/output/halo8_nequip_v1/training_run
    name: lightning_logs

  callbacks:
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      monitor: ${monitored_metric}
      dirpath:
        /gpfs/home1/yeseo1ee/projects/halo8-nequip-pretrain/output/halo8_nequip_v1/training_run
      filename: best
      save_last: true
      save_top_k: 1

    - _target_: lightning.pytorch.callbacks.EarlyStopping
      monitor: ${monitored_metric}
      min_delta: 1.0e-3
      patience: 100
      mode: min

    - _target_: lightning.pytorch.callbacks.LearningRateMonitor
      logging_interval: epoch


# =====================
#    TRAINING MODULE
# =====================
training_module:
  _target_: nequip.train.EMALightningModule
  ema_decay: 0.99

  loss:
    _target_: nequip.train.EnergyForceLoss
    per_atom_energy: true
    coeffs:
      total_energy: 1.0
      forces: 1.0

  val_metrics:
    _target_: nequip.train.EnergyForceMetrics
    coeffs:
      per_atom_energy_mae: 1.0
      forces_mae: 1.0
      per_atom_energy_rmse: 1.0
      forces_rmse: 1.0
  train_metrics: ${training_module.val_metrics}
  test_metrics: ${training_module.val_metrics}

  optimizer:
    _target_: torch.optim.Adam
    lr: 5.0e-3
    amsgrad: true

  lr_scheduler:
    scheduler:
      _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
      factor: 0.5
      patience: 50
      threshold: 1.0e-3
      min_lr: 1.0e-6
    monitor: ${monitored_metric}
    interval: epoch
    frequency: 1

  model:
    _target_: nequip.model.NequIPGNNModel
    seed: 42
    model_dtype: float32
    type_names: ${model_type_names}
    r_max: ${cutoff_radius}

    num_bessels: 8
    bessel_trainable: true
    polynomial_cutoff_p: 6

    num_layers: ${num_layers}
    l_max: ${l_max}
    parity: true
    num_features: ${num_features}

    radial_mlp_depth: 3
    radial_mlp_width: 64

    avg_num_neighbors: ${training_data_stats:num_neighbors_mean}
    per_type_energy_scales: ${training_data_stats:per_type_forces_rms}
    per_type_energy_shifts: ${training_data_stats:per_atom_energy_mean}
    per_type_energy_scales_trainable: false
    per_type_energy_shifts_trainable: false


# =====================
#    GLOBAL OPTIONS
# =====================
# set_global_state(allow_tf32, warn_on_override) — that's the entire surface.
# Seeds for data/model are set in their respective sections.
global_options:
  allow_tf32: true

# Halo8 NequIP pretraining config — Spec v5 §4
# n_train / n_val are injected by scripts/prepare_data.py via ruamel.yaml
# (comments here are preserved on re-write).

# ===== Run metadata =====
root: output/
run_name: halo8_nequip_v1
seed: 42
dataset_seed: 42
default_dtype: float32

# ===== Dataset =====
dataset: ase
dataset_file_name: output/halo8_nequip_v1/data/halo8_train.extxyz
validation_dataset: ase
validation_dataset_file_name: output/halo8_nequip_v1/data/halo8_val.extxyz
chemical_symbols: [H, C, N, O, F, Cl, Br]
key_mapping:
  energy: total_energy
  forces: forces

# Placeholders — overwritten by prepare_data.py
n_train: 1
n_val: 1

# ===== Model architecture — Batzner 2022 Methods =====
model_builders:
  - SimpleIrrepsConfig
  - EnergyModel
  - PerSpeciesRescale
  - ForceOutput
  - RescaleEnergyEtc

num_layers: 4
l_max: 2
parity: true
num_features: 64
nonlinearity_type: gate
resnet: true

r_max: 5.0                         # Deferred decision — revisit after Round 0
num_basis: 8
BesselBasis_trainable: true
PolynomialCutoff_p: 6
avg_num_neighbors: auto

invariant_layers: 3                # Batzner 2022: "three hidden layers"
invariant_neurons: 64

# ===== Loss =====
loss_coeffs:
  forces: 1.0
  total_energy:
    - 1.0
    - PerAtomMSELoss

# ===== Metrics =====
metrics_components:
  - - forces
    - mae
  - - forces
    - rmse
  - - total_energy
    - mae
    - PerAtom: True
  - - total_energy
    - rmse
    - PerAtom: True

# ===== Optimizer — Batzner 2022 =====
optimizer_name: Adam
learning_rate: 5.0e-3
optimizer_amsgrad: true
optimizer_betas: [0.9, 0.999]
optimizer_eps: 1.0e-8
optimizer_weight_decay: 0.0

lr_scheduler_name: ReduceLROnPlateau
lr_scheduler_patience: 50
lr_scheduler_factor: 0.5
lr_scheduler_threshold: 1.0e-3
lr_scheduler_min_lr: 1.0e-6

use_ema: true
ema_decay: 0.99
ema_use_num_updates: true

# ===== Training =====
batch_size: 5
validation_batch_size: 16
max_epochs: 200
shuffle: true
metrics_key: validation_loss

early_stopping_lower_bounds:
  LR: 1.0e-6
early_stopping_patiences:
  validation_loss: 100

# ===== Checkpointing — critical: do not reduce frequency =====
save_checkpoint_freq: 1
save_ema_checkpoint_freq: 1
n_save_keep: 3
log_epoch_freq: 1
log_batch_freq: 1000

# ===== Logging =====
verbose: info
wandb: false
wandb_project: halo8_nequip_pretrain
wandb_resume: allow
append: true

# Halo8 NequIP pretraining config — Spec v5 §4
# n_train / n_val are injected by scripts/prepare_data.py via ruamel.yaml
# (comments here are preserved on re-write).

# ===== Run metadata =====
# IMPORTANT: NequIP does `rmtree(f"{root}/{run_name}")` when there's no
# trainer.pth in that folder — i.e. on every fresh start before the first
# epoch checkpoint lands. So `root/run_name` must NOT overlap with our
# orchestration WORK_DIR (which holds the irreplaceable extxyz files in
# data/, slurm logs, sentinels, etc.). We isolate NequIP under a
# dedicated subfolder `training_run/`.
#
# Paths below are absolute so cwd changes in submit_pretrain.sh don't
# silently break dataset resolution.
root: /gpfs/home1/yeseo1ee/projects/halo8-nequip-pretrain/output/halo8_nequip_v1
run_name: training_run
seed: 42
dataset_seed: 42
default_dtype: float32

# ===== Dataset =====
dataset: ase
dataset_file_name: 
  /gpfs/home1/yeseo1ee/projects/halo8-nequip-pretrain/output/halo8_nequip_v1/data/halo8_train.extxyz
validation_dataset: ase
validation_dataset_file_name: 
  /gpfs/home1/yeseo1ee/projects/halo8-nequip-pretrain/output/halo8_nequip_v1/data/halo8_val.extxyz
chemical_symbols: [H, C, N, O, F, Cl, Br]
key_mapping:
  energy: total_energy
  forces: forces

# Placeholders — overwritten by prepare_data.py
n_train: 3075582
n_val: 49595

# ===== Model architecture — Batzner 2022 Methods =====
model_builders:
  - SimpleIrrepsConfig
  - EnergyModel
  - PerSpeciesRescale
  - ForceOutput
  - RescaleEnergyEtc

num_layers: 4
l_max: 2
parity: true
num_features: 64
nonlinearity_type: gate
resnet: true

r_max: 5.0                         # Deferred decision — revisit after Round 0
num_basis: 8
BesselBasis_trainable: true
PolynomialCutoff_p: 6
avg_num_neighbors: auto

invariant_layers: 3                # Batzner 2022: "three hidden layers"
invariant_neurons: 64

# ===== Loss =====
loss_coeffs:
  forces: 1.0
  total_energy:
    - 1.0
    - PerAtomMSELoss

# ===== Metrics =====
metrics_components:
  -   - forces
      - mae
  -   - forces
      - rmse
  -   - total_energy
      - mae
      - PerAtom: true
  -   - total_energy
      - rmse
      - PerAtom: true

# ===== Optimizer — Batzner 2022 =====
optimizer_name: Adam
learning_rate: 5.0e-3
optimizer_amsgrad: true
optimizer_betas: [0.9, 0.999]
optimizer_eps: 1.0e-8
optimizer_weight_decay: 0.0

lr_scheduler_name: ReduceLROnPlateau
lr_scheduler_patience: 50
lr_scheduler_factor: 0.5
lr_scheduler_threshold: 1.0e-3
lr_scheduler_min_lr: 1.0e-6

use_ema: true
ema_decay: 0.99
ema_use_num_updates: true

# ===== Training =====
batch_size: 4
validation_batch_size: 8
max_epochs: 200
shuffle: true
metrics_key: validation_loss

# Skip the pre-training validation pass — for 49,595 val frames it took
# ~2h17min on RTX 3090 with bs=16 and crashed the worker chain at the
# transition into epoch 1. With report_init_validation=False training
# begins immediately; the first validation metrics arrive at the end of
# epoch 1 (a few minutes in).
report_init_validation: false

early_stopping_lower_bounds:
  LR: 1.0e-6
early_stopping_patiences:
  validation_loss: 100

# ===== Checkpointing — critical: do not reduce frequency =====
save_checkpoint_freq: 1
save_ema_checkpoint_freq: 1
n_save_keep: 3
log_epoch_freq: 1
log_batch_freq: 1000

# ===== Logging =====
verbose: info
wandb: false
wandb_project: halo8_nequip_pretrain
wandb_resume: allow
append: true

# NequIP's _unused_check otherwise hard-fails when wandb is disabled
# (n_save_keep, wandb_project, wandb_resume become "unused"). Downgrade
# to a warning so the run can actually start.
warn_unused: true
